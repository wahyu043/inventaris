{% extends "base.html" %}
{% block title %}Barang{% endblock %}
{% block content %}
<h1>Master Barang</h1>
<table border="1" cellpadding="6" cellspacing="0">
  <tr><th>No</th><th>Kode</th><th>Nama Barang</th><th>Stok</th></tr>
  {% for r in rows %}
  <tr><td>{{ loop.index }}</td><td>{{ r.kode }}</td><td>{{ r.nama }}</td><td>{{ r.stok }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
