<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Inventaris{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat Alternates', sans-serif; background:#0a192f; color:#ccd6f6; max-width:720px; margin:40px auto; padding:0 16px; }
    a, h1 { color:#64ffda; }
    input, button { font:inherit; padding:8px; margin:4px 0; }
    .flash { color:#ff6b6b; }
    .flash.ok { color:#64ffda; }
    .summary-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; margin:24px 0 32px; }
    .summary-card { background:#112240; border:1px solid #233554; border-radius:8px; padding:16px; }
    .summary-card h2 { font-size:1rem; margin:0; color:#a8b2d1; }
    .summary-value { color:#64ffda; font-size:2rem; font-weight:600; margin:12px 0 0; }
    .summary-note { color:#a8b2d1; font-size:.85rem; margin:0; }
    .stock-low { color:#ffd166; }
    .stock-empty { color:#ff6b6b; }
    .stock-ok { color:#64ffda; }
    table { border-color:#233554; }
  </style>
</head>
<body>
  {% if session.user_id %}
  <nav><a href="{{ url_for('index') }}">Dashboard</a> | <a href="{{ url_for('barang') }}">Barang</a> | <a href="{{ url_for('masuk_list') }}">Barang Masuk</a> | <a href="{{ url_for('keluar_list') }}">Barang Keluar</a> | <a href="{{ url_for('logout') }}">Logout</a></nav>
  {% endif %}
  {% for kategori, m in get_flashed_messages(with_categories=true) %}<p class="flash {{ kategori }}">{{ m }}</p>{% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
