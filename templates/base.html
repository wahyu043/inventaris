<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Inventaris{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat Alternates', sans-serif; background:#0a192f; color:#ccd6f6; max-width:720px; margin:40px auto; padding:0 16px; }
    a, h1 { color:#64ffda; }
    input, button { font:inherit; padding:8px; margin:4px 0; }
    .flash { color:#ff6b6b; }
  </style>
</head>
<body>
  {% for m in get_flashed_messages() %}<p class="flash">{{ m }}</p>{% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
